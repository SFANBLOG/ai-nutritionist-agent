# ============================================
# AI 营养师 Agent - 全套容器编排
# 组件: etcd / MinIO / Milvus / MySQL / 后端 / 前端
#
# 数据库默认 MySQL(开箱即用),后端自动连 mysql:3306。
#
# 启动:  docker compose up -d --build
# 停止:  docker compose down            (保留数据卷)
# 清空:  docker compose down -v         (连同数据卷一起删除)
# 状态:  docker compose ps
# 日志:  docker compose logs -f backend
#
# 访问:
#   前端        http://localhost:18080       (nginx, 含 /api 反代)
#   后端 API    http://localhost:8000/docs
#   MinIO 控制台 http://localhost:19001       (minioadmin / minioadmin)
#   MySQL       localhost:13306               (ai_user / ai_password, 库 ai_nutritionist)
#
# 说明:宿主 3306 已被本机 MySQL80 服务占用、9000/9001 已被其它 MinIO 容器占用,
#       故本编排将 MySQL/MinIO 的宿主端口映射到 13306 / 19000-19001 以避开冲突;
#       容器内部网络仍是标准端口,后端通过 mysql:3306 / minio:9000 访问,无需改动。
#
# 启用真实 LLM(可选):
#   在项目根目录创建 .env 写入 OPENAI_API_KEY=sk-xxx 后重新 up,
#   或先 export OPENAI_API_KEY=sk-xxx。留空则后端自动进入规则引擎模式。
# ============================================
name: ai-nutritionist

services:
  # ---------- Milvus 依赖:etcd ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: ain-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ---------- MinIO(同时供 Milvus 与业务对象存储) ----------
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ain-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ---------- Milvus 向量数据库(standalone) ----------
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: ain-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ---------- MySQL(业务主数据库,默认) ----------
  mysql:
    image: mysql:8.0
    container_name: ain-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=ai_root_password
      - MYSQL_DATABASE=ai_nutritionist
      - MYSQL_USER=ai_user
      - MYSQL_PASSWORD=ai_password
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uai_user -pai_password --silent"]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------- 后端(FastAPI) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-nutritionist-backend:latest
    container_name: ain-backend
    environment:
      # 数据库:默认 MySQL(容器内主机名 mysql)
      - DATABASE_URL=mysql+pymysql://ai_user:ai_password@mysql:3306/ai_nutritionist?charset=utf8mb4
      # 开发默认值；生产环境必须通过受管密钥和部署变量显式覆盖。
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      # LLM:由宿主机环境变量注入(留空则规则引擎模式)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # BGE 向量化
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      - EMBEDDING_DIM=512
      - HF_ENDPOINT=https://hf-mirror.com
      # 向量库 Milvus
      - VECTOR_DB_TYPE=milvus
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_CONNECT_RETRIES=30
      - MILVUS_CONNECT_BACKOFF=5
      # 对象存储 MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=ai-nutritionist-uploads
      - MINIO_SECURE=false
      # 多日菜单 + 人工确认闸门(HITL)
      - HUMAN_REVIEW_GATE=true
      - MAX_REVISION_REQUESTS=3
      - MENU_DEFAULT_DAYS=1
      - MENU_MAX_DAYS=7
      # 前端访问来源(nginx 容器映射的 18080)
      - CORS_ORIGINS=http://localhost:18080,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 5
    restart: on-failure

  # ---------- 前端(Vue3 + nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-nutritionist-frontend:latest
    container_name: ain-frontend
    ports:
      # 8080 常被本机其它 Web 项目占用，使用独立端口避免启动失败。
      - "18080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
  mysql-data:
