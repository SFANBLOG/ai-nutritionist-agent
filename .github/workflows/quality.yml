name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight runtime dependencies
        run: pip install -r backend/requirements-lite.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Validate production configuration guard
        env:
          PYTHONPATH: backend
          ENVIRONMENT: production
          DEBUG: "false"
          SECRET_KEY: 0123456789012345678901234567890123456789
          DATABASE_URL: mysql+pymysql://user:password@db:3306/nutrition
          CORS_ORIGINS: https://nutrition.example.com
        run: python -c "from app.core.config import Settings; assert not Settings().production_configuration_errors()"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
